<svg xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" width="1700" height="1080" viewBox="0 0 1700 1080"><title>Adaptación de dominio mediante SimSiam: control D2 y adaptación D3</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#65564b"/></marker></defs><rect width="1700" height="1080" fill="white"/><style>text{font-family:"Times New Roman","Nimbus Roman",serif;fill:#302b27;font-weight:400}.e{fill:none;stroke:#65564b;stroke-width:1.7;marker-end:url(#a)}</style>
<text x="850" y="48" text-anchor="middle" font-size="27">Inicialización común · DINOv2 ViT-B/14 con pesos públicos</text>
<rect x="60" y="105" width="730" height="100" rx="4" stroke="#a38a77" stroke-width="1.2" fill="#f4eadf"/>
<text x="425.0" y="147.18" text-anchor="middle" font-size="24">D2 · Control</text>
<text x="425.0" y="178.18" text-anchor="middle" font-size="24">Imágenes del dominio fuente, sin etiquetas diagnósticas</text>
<rect x="910" y="105" width="730" height="100" rx="4" stroke="#a38a77" stroke-width="1.2" fill="#f4eadf"/>
<text x="1275.0" y="147.18" text-anchor="middle" font-size="24">D3 · Adaptación</text>
<text x="1275.0" y="178.18" text-anchor="middle" font-size="24">Fuente + PAD-UFES-20 · target_adapt, sin etiquetas</text>
<path d="M425 205 V260" class="e"/>
<rect x="60" y="260" width="730" height="155" rx="4" stroke="#a38a77" stroke-width="1.2" fill="#f4eadf"/>
<text x="425.0" y="314.18" text-anchor="middle" font-size="24">Dos vistas aumentadas: x1 = t1(x), x2 = t2(x)</text>
<text x="425.0" y="345.18" text-anchor="middle" font-size="24">SimSiam: encoder fθ + proyector gθ + predictor hθ</text>
<text x="425.0" y="376.18" text-anchor="middle" font-size="24">ℒ = ½ D(p1, sg(z2)) + ½ D(p2, sg(z1))</text>
<path d="M425 415 V490" class="e"/>
<rect x="60" y="490" width="730" height="115" rx="4" stroke="#a38a77" stroke-width="1.2" fill="#f4eadf"/>
<text x="425.0" y="539.5" text-anchor="middle" font-size="25">Encoder adaptado → congelado</text>
<text x="425.0" y="571.5" text-anchor="middle" font-size="25">Extracción de características: v = fθ(x)</text>
<path d="M425 605 V670" class="e"/>
<rect x="60" y="670" width="730" height="115" rx="4" stroke="#a38a77" stroke-width="1.2" fill="#f4eadf"/>
<text x="425.0" y="719.68" text-anchor="middle" font-size="24">Escalador + regresión logística</text>
<text x="425.0" y="750.68" text-anchor="middle" font-size="24">Ajuste supervisado con HAM10000 etiquetado</text>
<path d="M1275 205 V260" class="e"/>
<rect x="910" y="260" width="730" height="155" rx="4" stroke="#a38a77" stroke-width="1.2" fill="#f4eadf"/>
<text x="1275.0" y="314.18" text-anchor="middle" font-size="24">Dos vistas aumentadas: x1 = t1(x), x2 = t2(x)</text>
<text x="1275.0" y="345.18" text-anchor="middle" font-size="24">SimSiam: encoder fθ + proyector gθ + predictor hθ</text>
<text x="1275.0" y="376.18" text-anchor="middle" font-size="24">ℒ = ½ D(p1, sg(z2)) + ½ D(p2, sg(z1))</text>
<path d="M1275 415 V490" class="e"/>
<rect x="910" y="490" width="730" height="115" rx="4" stroke="#a38a77" stroke-width="1.2" fill="#f4eadf"/>
<text x="1275.0" y="539.5" text-anchor="middle" font-size="25">Encoder adaptado → congelado</text>
<text x="1275.0" y="571.5" text-anchor="middle" font-size="25">Extracción de características: v = fθ(x)</text>
<path d="M1275 605 V670" class="e"/>
<rect x="910" y="670" width="730" height="115" rx="4" stroke="#a38a77" stroke-width="1.2" fill="#f4eadf"/>
<text x="1275.0" y="719.68" text-anchor="middle" font-size="24">Escalador + regresión logística</text>
<text x="1275.0" y="750.68" text-anchor="middle" font-size="24">Ajuste supervisado con HAM10000 etiquetado</text>
<text x="850" y="1050" text-anchor="middle" font-size="22">z = gθ(fθ(x)) · p = hθ(z) · sg: stop-gradient · D: similitud coseno negativa</text>
<text x="850" y="80" text-anchor="middle" font-size="22">Mismas particiones y protocolo supervisado · escalador y clasificador independientes por condición</text>
<path d="M425 785 V825 H850 V865" class="e"/>
<path d="M1275 785 V825 H850 V865" class="e"/>
<rect x="400" y="865" width="900" height="95" rx="4" stroke="#a38a77" stroke-width="1.2" fill="#faf8f5"/>
<text x="850.0" y="904.5" text-anchor="middle" font-size="25">Comparación sobre PAD-UFES-20 · target_test</text>
<text x="850.0" y="936.5" text-anchor="middle" font-size="25">Macro-F1 · AUC-ROC · Exactitud</text>
<text x="850" y="997" text-anchor="middle" font-size="22">target_adapt y target_test separados por paciente · ninguna realimentación hacia entrenamiento o ajuste</text>
</svg>