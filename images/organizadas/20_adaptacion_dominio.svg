<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1529" viewBox="0 0 1700 1529"><title>Adaptación de dominio mediante SimSiam: control D2 y adaptación D3</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#65564b" /></marker></defs><rect width="1700" height="1529" fill="white" /><style>text{font-family:"Times New Roman","Nimbus Roman",serif;fill:#302b27;font-weight:400}.e{fill:none;stroke:#65564b;stroke-width:1.7;marker-end:url(#a)}</style><text x="850" y="52" font-size="58" text-anchor="middle">Inicialización común · DINOv2 ViT-B/14 con pesos públicos</text><text x="850" y="100" font-size="53" text-anchor="middle">Mismas particiones y protocolo supervisado</text><text x="850" y="148" font-size="53" text-anchor="middle">Escalador y clasificador independientes por condición</text><rect x="60" y="185" width="730" height="184" rx="4" fill="#f4eadf" stroke="#a38a77" stroke-width="1.2" /><text x="425.0" y="233" font-size="53" text-anchor="middle">D2 · Control</text><text x="425.0" y="281" font-size="53" text-anchor="middle">Imágenes del dominio fuente, sin</text><text x="425.0" y="329" font-size="53" text-anchor="middle">etiquetas diagnósticas</text><rect x="910" y="185" width="730" height="184" rx="4" fill="#f4eadf" stroke="#a38a77" stroke-width="1.2" /><text x="1275.0" y="233" font-size="53" text-anchor="middle">D3 · Adaptación</text><text x="1275.0" y="281" font-size="45" text-anchor="middle">Fuente + PAD-UFES-20 · target_adapt,</text><text x="1275.0" y="329" font-size="53" text-anchor="middle">sin etiquetas</text><path d="M425 369 V424" class="e" /><path d="M1275 369 V424" class="e" /><rect x="60" y="424" width="730" height="232" rx="4" fill="#f4eadf" stroke="#a38a77" stroke-width="1.2" /><text x="425.0" y="472" font-size="53" text-anchor="middle">Dos vistas: x1 = t1(x), x2 = t2(x)</text><text x="425.0" y="520" font-size="47" text-anchor="middle">SimSiam: encoder fθ + proyector gθ +</text><text x="425.0" y="568" font-size="53" text-anchor="middle">predictor hθ</text><text x="425.0" y="616" font-size="45" text-anchor="middle">ℒ = ½ D(p1, sg(z2)) + ½ D(p2, sg(z1))</text><rect x="910" y="424" width="730" height="232" rx="4" fill="#f4eadf" stroke="#a38a77" stroke-width="1.2" /><text x="1275.0" y="472" font-size="53" text-anchor="middle">Dos vistas: x1 = t1(x), x2 = t2(x)</text><text x="1275.0" y="520" font-size="47" text-anchor="middle">SimSiam: encoder fθ + proyector gθ +</text><text x="1275.0" y="568" font-size="53" text-anchor="middle">predictor hθ</text><text x="1275.0" y="616" font-size="45" text-anchor="middle">ℒ = ½ D(p1, sg(z2)) + ½ D(p2, sg(z1))</text><path d="M425 656 V711" class="e" /><path d="M1275 656 V711" class="e" /><rect x="60" y="711" width="730" height="136" rx="4" fill="#f4eadf" stroke="#a38a77" stroke-width="1.2" /><text x="425.0" y="759" font-size="53" text-anchor="middle">Encoder adaptado → congelado</text><text x="425.0" y="807" font-size="46" text-anchor="middle">Extracción de características: v = fθ(x)</text><rect x="910" y="711" width="730" height="136" rx="4" fill="#f4eadf" stroke="#a38a77" stroke-width="1.2" /><text x="1275.0" y="759" font-size="53" text-anchor="middle">Encoder adaptado → congelado</text><text x="1275.0" y="807" font-size="46" text-anchor="middle">Extracción de características: v = fθ(x)</text><path d="M425 847 V902" class="e" /><path d="M1275 847 V902" class="e" /><rect x="60" y="902" width="730" height="184" rx="4" fill="#f4eadf" stroke="#a38a77" stroke-width="1.2" /><text x="425.0" y="950" font-size="53" text-anchor="middle">Escalador + regresión logística</text><text x="425.0" y="998" font-size="49" text-anchor="middle">Ajuste supervisado con HAM10000</text><text x="425.0" y="1046" font-size="53" text-anchor="middle">etiquetado</text><rect x="910" y="902" width="730" height="184" rx="4" fill="#f4eadf" stroke="#a38a77" stroke-width="1.2" /><text x="1275.0" y="950" font-size="53" text-anchor="middle">Escalador + regresión logística</text><text x="1275.0" y="998" font-size="49" text-anchor="middle">Ajuste supervisado con HAM10000</text><text x="1275.0" y="1046" font-size="53" text-anchor="middle">etiquetado</text><path d="M425 1086 V1116 H850 V1141" class="e" /><path d="M1275 1086 V1116 H850 V1141" class="e" /><rect x="300" y="1141" width="1100" height="136" rx="4" fill="#f4eadf" stroke="#a38a77" stroke-width="1.2" /><text x="850.0" y="1189" font-size="53" text-anchor="middle">Comparación sobre PAD-UFES-20 · target_test</text><text x="850.0" y="1237" font-size="53" text-anchor="middle">Macro-F1 · AUC-ROC · exactitud</text><text x="850" y="1337" font-size="53" text-anchor="middle">target_adapt y target_test separados por paciente</text><text x="850" y="1385" font-size="53" text-anchor="middle">Ninguna realimentación hacia entrenamiento o ajuste</text><text x="850" y="1433" font-size="53" text-anchor="middle">z = gθ(fθ(x)) · p = hθ(z) · sg: stop-gradient</text><text x="850" y="1481" font-size="53" text-anchor="middle">D: similitud coseno negativa</text></svg>