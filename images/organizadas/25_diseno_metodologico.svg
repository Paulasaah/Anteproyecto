<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1220" viewBox="0 0 1200 1220"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#65564b"/></marker></defs><rect width="1200" height="1220" fill="white"/><style>text{font-family:"Times New Roman","Nimbus Roman",serif;font-weight:400;fill:#302b27}.arrow{fill:none;stroke:#65564b;stroke-width:2;marker-end:url(#arr)}</style><text x="600" y="45" font-size="32" text-anchor="middle">Aplicación de CRISP-ML(Q)</text><text x="600" y="110" font-size="32" text-anchor="middle">1. Comprensión del problema y los datos</text><rect x="55" y="140" width="1090" height="135" rx="5" fill="#f4ede6" stroke="#a38a77" stroke-width="1.5"/><text x="600.0" y="182.5" font-size="28" text-anchor="middle">Investigación aplicada, cuantitativa y experimental</text><text x="600.0" y="217.5" font-size="28" text-anchor="middle">Contexto de Santander · HAM10000, ISIC2019, ISIC2020 y PAD-UFES-20</text><text x="600.0" y="252.5" font-size="28" text-anchor="middle">Caracterización, criterios de selección y riesgos iniciales</text><path d="M600 275 V287" class="arrow"/><text x="600" y="320" font-size="32" text-anchor="middle">2. Ingeniería de datos y modelado</text><rect x="55" y="355" width="490" height="180" rx="5" fill="#f4ede6" stroke="#a38a77" stroke-width="1.5"/><text x="300.0" y="420.0" font-size="28" text-anchor="middle">Módulo principal</text><text x="300.0" y="455.0" font-size="28" text-anchor="middle">Clasificación SSL y adaptación</text><text x="300.0" y="490.0" font-size="28" text-anchor="middle">DINOv2 + SimSiam</text><rect x="655" y="355" width="490" height="180" rx="5" fill="#f4ede6" stroke="#a38a77" stroke-width="1.5"/><text x="900.0" y="402.5" font-size="28" text-anchor="middle">Módulos complementarios</text><text x="900.0" y="437.5" font-size="28" text-anchor="middle">Segmentación: MoCo → CCAM → U-Net</text><text x="900.0" y="472.5" font-size="28" text-anchor="middle">Estimación ITA y transformación</text><text x="900.0" y="507.5" font-size="28" text-anchor="middle">CIELAB</text><text x="600" y="590" font-size="28" text-anchor="middle">Integración del segmentador: trabajo futuro</text><path d="M600 620 V640" class="arrow"/><text x="600" y="675" font-size="32" text-anchor="middle">3. Evaluación de cada componente</text><rect x="55" y="710" width="1090" height="185" rx="5" fill="#f4ede6" stroke="#a38a77" stroke-width="1.5"/><text x="600.0" y="760.0" font-size="28" text-anchor="middle">Tono: contraste ITA–Fitzpatrick</text><text x="600.0" y="795.0" font-size="28" text-anchor="middle">Segmentación: Dice</text><text x="600.0" y="830.0" font-size="28" text-anchor="middle">Clasificación: métricas, bootstrap y Holm</text><text x="600.0" y="865.0" font-size="28" text-anchor="middle">Comparación e interpretación para seleccionar la configuración</text><path d="M600 895 V920" class="arrow"/><text x="600" y="955" font-size="32" text-anchor="middle">4. Implementación y despliegue · pendiente</text><rect x="55" y="990" width="1090" height="130" rx="5" fill="#f4ede6" stroke="#a38a77" stroke-width="1.5"/><text x="600.0" y="1047.5" font-size="28" text-anchor="middle">Prototipo funcional mediante API</text><text x="600.0" y="1082.5" font-size="28" text-anchor="middle">Sujeto a experimentos y selección del modelo final</text><text x="600" y="1180" font-size="24" text-anchor="middle">El esquema organiza las fases; no implica despliegue clínico realizado.</text></svg>